<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filter cases</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/0197031cd7cfeb6dd68aec3fd9f1230f">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#1f4e8c}a:hover{color:#163a69}</style>
</helmet>
<main class="app" style="width: 390px; height: 844px">
  <div class="page">
    <h1 class="h1">My cases</h1>
    <div class="card" style="height: 120px"></div>
    <div class="card" style="height: 120px"></div>
  </div>
  <a href="CaseList.dc.html" class="scrim" aria-label="Close filters"></a>
  <section class="sheet" aria-label="Filter cases" style="max-height: 780px">
    <span class="grab" aria-hidden="true"></span>
    <div class="top"><h2 class="h2" style="flex: 1; font-size: 19px">Filter cases</h2><a href="#" style="font-size: 14px; font-weight: 700">Clear all</a></div>

    <div class="field"><span>Status</span>
      <div class="chips">
        <a class="chip" href="#">New</a><a class="chip on" href="#">Assigned</a><a class="chip on" href="#">In Progress</a><a class="chip" href="#">Hold</a><a class="chip" href="#">Escalated</a><a class="chip" href="#">Reopened</a><a class="chip" href="#">Closed</a>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <label class="field"><span>Category</span><div class="input"><select aria-label="Category"><option>Order Status</option></select></div></label>
      <label class="field"><span>Sub-category</span><div class="input"><select aria-label="Sub-category"><option>All</option></select></div></label>
    </div>
    <label class="field"><span>Priority</span><div class="input"><select aria-label="Priority"><option>Any priority</option></select></div></label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <label class="field"><span>From</span><div class="input"><input type="text" value="01 Oct 2026" aria-label="From date"></div></label>
      <label class="field"><span>To</span><div class="input"><input type="text" value="Today" aria-label="To date"></div></label>
    </div>
    <label style="display: flex; align-items: center; gap: 12px; min-height: 44px">
      <span class="check on"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="m5 12 5 5 9-10"/></svg></span>
      <span style="flex: 1; font-size: 14px; font-weight: 700">Order-related cases only</span>
    </label>
    <a class="btn" href="CaseList.dc.html">Show 9 cases</a>
  </section>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
